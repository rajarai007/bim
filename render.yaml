# Render Blueprint for the backend API (free tier).
#
# Render dashboard → New → Blueprint → select this repo. Render reads this file,
# creates the service and prompts for the two secrets marked `sync: false`.
# The frontends deploy separately on Netlify; only the API lives here.
#
# Free-tier notes:
#  - The instance sleeps after 15 min idle and takes ~35 s to wake. A Netlify scheduled
#    function (Frontend/Client/netlify/functions/keep-api-awake.mts) pings /health/live
#    every 10 min; .github/workflows/keep-alive.yml is a best-effort backup.
#  - The filesystem is ephemeral, so uploads are stored in Postgres (UPLOAD_STORAGE=db).
services:
  - type: web
    name: bim-api
    runtime: node
    plan: free
    region: singapore
    rootDir: Backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate:prod && npm run db:seed:prod && npm start
    # Liveness only: /health runs a query, and Render checks every few seconds while the
    # instance is up, which would keep the Neon compute from ever suspending.
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: UPLOAD_STORAGE
        value: db
      - key: SEED_DEMO_DATA
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: PUBLIC_URL
        value: https://api.bimcareeracademy.com
      - key: CORS_ORIGINS
        value: https://bimcareeracademy.com,https://www.bimcareeracademy.com,https://admin.bimcareeracademy.com
      - key: ADMIN_URL
        value: https://admin.bimcareeracademy.com
      # Admin edits expire the public site's page cache (same secret on Netlify).
      - key: SITE_REVALIDATE_URL
        value: https://bimcareeracademy.com/api/revalidate
      - key: REVALIDATE_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
