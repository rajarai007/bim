# Keeps the free Render instance from sleeping (it spins down after 15 idle
# minutes and takes ~1 min to wake). Pings /health every 10 minutes.
#
# Override the target with a repository variable named API_URL
# (Settings → Secrets and variables → Actions → Variables).
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health
        env:
          API_URL: ${{ vars.API_URL || 'https://api.bimcareeracademy.com' }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 90 "$API_URL/health" || echo "000")
          echo "$API_URL/health -> HTTP $status"
